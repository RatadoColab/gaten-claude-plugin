# Referência: domains/api-rest/SKILL.md — Seção OpenAPI 3.1
# Quando usar: modelo de spec OpenAPI para novos endpoints

openapi: "3.1.0"
info:
  title: Minha API
  version: "1.0.0"
paths:
  /users:
    get:
      summary: List users
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
